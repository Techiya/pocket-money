    <text y="20" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="58" fill="#b77d00">₪</text>
  </g>
  <!-- רגליים -->
  <rect x="160" y="370" width="42" height="62" rx="16" fill="#ff7fab"/>
