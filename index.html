<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>דמי כיס</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דמי כיס">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f6fb">
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e7ef;
    --accent: #3b6ef5; --good: #1f9d63; --bad: #d64545; --warn: #c98a12; --soft: #eaf0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 17px; margin: 22px 0 8px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(20,30,60,.07); margin-bottom: 12px; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stat { background: var(--soft); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 19px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
  button.light { background: var(--soft); color: var(--accent); }
  button.good { background: var(--good); } button.bad { background: var(--bad); }
  button.small { padding: 6px 10px; font-size: 14px; border-radius: 9px; }
  button:disabled { opacity: .5; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .names button { padding: 26px 10px; font-size: 20px; background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,30,60,.1); }
  .names button.parent { grid-column: 1 / -1; background: var(--ink); color: #fff; padding: 16px; font-size: 17px; }
  .badge { display: inline-block; min-width: 22px; padding: 1px 7px; margin-inline-start: 8px; border-radius: 11px; background: var(--bad); color: #fff; font-size: 14px; font-weight: 700; }
  .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
  .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); }
  .pin-dots span.on { background: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; direction: ltr; }
  .pad button { padding: 18px 0; font-size: 22px; background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,30,60,.1); }
  .pad button.ok { background: var(--good); color: #fff; font-size: 18px; font-weight: 700; }
  .busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; animation: busy 1s linear infinite; z-index: 30; }
  @keyframes busy { from { background-position: -50% 0; } to { background-position: 150% 0; } }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .actions button { padding: 14px 6px; font-size: 15px; }
  .tx { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .tx:last-child { border-bottom: 0; }
  .tx .amt { font-weight: 700; white-space: nowrap; direction: ltr; }
  .plus { color: var(--good); } .minus { color: var(--bad); } .pend { color: var(--warn); }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 8px; background: var(--soft); color: var(--accent); margin-inline-start: 6px; }
  .tag.pend { background: #fff3dc; color: var(--warn); }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .kidcard { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .modal { position: fixed; inset: 0; background: rgba(15,20,35,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 16px 28px; max-height: 92vh; overflow: auto; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 20; max-width: 90vw; }
  .err { color: var(--bad); text-align: center; min-height: 22px; }
  .center { text-align: center; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<script>
  // בדיקה מקומית עם נתוני דמה: index.html?mock
  if (location.search.includes('mock')) document.write('<script src="../dev/mock.js"><\/script>');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
<script>
const PARENT = 'הורה';
const KID_IDLE_MS = 5 * 60 * 1000;
let token = sessionStorage.getItem('pm_token');
let state = null;
let view = { kid: null };
let idleTimer;

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (Math.round(n * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 }) + ' ₪';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const heDate = s => s ? s.split('-').reverse().join('/') : '';

// פס טעינה דק למעלה כל עוד יש קריאה לשרת
let inflight = 0;
function busy(delta) {
  inflight += delta;
  let bar = document.querySelector('.busy');
  if (inflight > 0 && !bar) { bar = document.createElement('div'); bar.className = 'busy'; document.body.appendChild(bar); }
  if (inflight <= 0 && bar) bar.remove();
}

// כתובת השרת (Apps Script) לא כתובה בקוד הציבורי: מגיעה פעם אחת בקישור #api=... ונשמרת במכשיר
function apiUrl() {
  const m = location.hash.match(/api=([^&]+)/);
  if (m) {
    try { localStorage.setItem('pm_api', decodeURIComponent(m[1])); } catch (_) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  try { return localStorage.getItem('pm_api'); } catch (_) { return null; }
}

async function call(fn, ...args) {
  busy(1);
  try {
    if (window.MOCK_API) return await window.MOCK_API(fn, args);
    const res = await fetch(apiUrl(), {
      method: 'POST',
      // text/plain כדי שהדפדפן לא ישלח בקשת OPTIONS, שגוגל לא עונה עליה
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    return j.result;
  } finally { busy(-1); }
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function api(fn, ...args) {
  try {
    const r = await call(fn, token, ...args);
    if (r && r.role) { state = r; render(); }
    return r;
  } catch (e) {
    const msg = e.message || String(e);
    if (msg.includes('SESSION_EXPIRED')) { doLogout(); toast('החיבור פג, צריך להיכנס שוב'); }
    else toast(msg);
    throw e;
  }
}

// ---------- כניסה ----------

function renderNoServer() {
  $app.innerHTML = `
    <header><h1>דמי כיס</h1></header>
    <div class="card">
      <p>צריך לחבר את המכשיר לשרת, פעם אחת בלבד.</p>
      <p class="muted">פתחו את קישור ההתקנה שקיבלתם (הוא מסתיים ב-<span dir="ltr">#api=…</span>), או הדביקו כאן את כתובת השרת שמסתיימת ב-<span dir="ltr">/exec</span>.</p>
      <input id="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="save" style="width:100%;margin-top:10px">חיבור</button>
    </div>`;
  document.getElementById('save').onclick = () => {
    const u = document.getElementById('url').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) return toast('הכתובת לא נראית נכונה');
    try { localStorage.setItem('pm_api', u); } catch (_) {}
    start();
  };
}

async function start() {
  if (!window.MOCK_API && !apiUrl()) return renderNoServer();
  if (token) {
    try { state = await call('getState', token); render(); return; } catch (e) { token = null; sessionStorage.removeItem('pm_token'); }
  }
  const info = await call('getLoginInfo');
  info.needsSetup ? renderPin(PARENT, true) : renderNames(info.kids, info.pendingCount);
}

function renderNames(names, pendingCount) {
  $app.innerHTML = `
    <header><h1>דמי כיס</h1></header>
    <p class="muted center">מי נכנס?</p>
    <div class="names">
      ${names.map(n => `<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}
      <button class="parent" data-n="${PARENT}">כניסת הורה${pendingCount ? `<span class="badge">${pendingCount}</span>` : ''}</button>
    </div>`;
  $app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => renderPin(b.dataset.n, false));
}

function renderPin(who, setup) {
  let pin = '', first = null;
  const title = setup ? 'הגדרת קוד הורה (4–8 ספרות)' : who;
  $app.innerHTML = `
    <header><h1>${esc(title)}</h1>${setup ? '' : '<button class="ghost" id="back">חזרה</button>'}</header>
    <p class="muted center" id="hint">${setup ? 'בחרו קוד והקישו "אישור"' : 'הקלידו את הקוד'}</p>
    <div class="pin-dots" id="dots"></div>
    <div class="err" id="err"></div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-d="${d}">${d}</button>`).join('')}
      <button data-d="del">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">✓ אישור</button>
    </div>`;
  const back = document.getElementById('back');
  if (back) back.onclick = start;
  const dots = () => document.getElementById('dots').innerHTML =
    Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<span class="${i < pin.length ? 'on' : ''}"></span>`).join('');
  dots();
  $app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    const d = b.dataset.d;
    document.getElementById('err').textContent = '';
    if (d === 'del') pin = pin.slice(0, -1);
    else if (d !== 'ok') { if (pin.length < 8) pin += d; }
    else {
      if (pin.length < 4) return document.getElementById('err').textContent = 'לפחות 4 ספרות';
      if (setup && first === null) { first = pin; pin = ''; document.getElementById('hint').textContent = 'הקלידו שוב לאישור'; dots(); return; }
      if (setup && first !== pin) { first = null; pin = ''; document.getElementById('err').textContent = 'הקודים לא תואמים, נסו שוב'; document.getElementById('hint').textContent = 'בחרו קוד'; dots(); return; }
      document.getElementById('hint').textContent = 'נכנסים…';
      try {
        const r = await call(setup ? 'firstSetup' : 'login', ...(setup ? [pin] : [who, pin]));
        token = r.token; state = r.state;
        sessionStorage.setItem('pm_token', token);
        view = { kid: null };
        render();
      } catch (e) { pin = ''; dots(); document.getElementById('hint').textContent = ''; document.getElementById('err').textContent = e.message || e; }
      return;
    }
    dots();
  });
}

function doLogout() {
  if (token) call('logout', token).catch(() => {});
  token = null; state = null; sessionStorage.removeItem('pm_token');
  clearTimeout(idleTimer);
  start();
}

// ילד שעזב את הטאבלט פתוח – יציאה אוטומטית
function armIdle() {
  clearTimeout(idleTimer);
  if (state && state.role !== PARENT) idleTimer = setTimeout(doLogout, KID_IDLE_MS);
}
['click', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, armIdle, { passive: true }));

// ---------- תצוגות ----------

function render() {
  armIdle();
  if (state.role === PARENT) return view.kid ? renderKid(state.kids.find(k => k.name === view.kid), true) : renderParent();
  renderKid(state.me, false);
}

function renderParent() {
  const p = state.pending;
  $app.innerHTML = `
    <header><h1>שלום הורה</h1><button class="ghost" id="out">יציאה</button></header>
    ${state.kids.map(k => `
      <div class="card kidcard" data-k="${esc(k.name)}">
        <div><b style="font-size:19px">${esc(k.name)}</b>
          <div class="muted">שמור למעשר: ${money(Math.max(k.maaser, 0))}${k.pending ? ` · <span class="pend">ממתין ${money(k.pending)}</span>` : ''}</div></div>
        <div class="big" style="font-size:28px">${money(k.available)}</div>
      </div>`).join('')}
    <h2>ממתין לאישור ${p.length ? `(${p.length})` : ''}</h2>
    <div class="card">${p.length ? p.map(t => `
      <div class="tx"><div><b>${esc(t.kid)}</b> · ${esc(t.reason || 'ללא סיבה')}<div class="muted">${heDate(t.date)}</div></div>
        <div class="row" style="flex:0 0 auto;align-items:center"><span class="amt plus">+${money(t.amount)}</span>
          <button class="small good" data-ok="${t.id}">אישור</button><button class="small bad" data-no="${t.id}">דחייה</button></div></div>`).join('')
      : '<div class="muted">אין בקשות</div>'}</div>
    <h2>הגדרות</h2>
    <div class="card row"><button class="light" id="pins">קודים</button></div>`;
  document.getElementById('out').onclick = doLogout;
  document.getElementById('pins').onclick = pinsForm;
  $app.querySelectorAll('[data-k]').forEach(c => c.onclick = () => { view.kid = c.dataset.k; render(); scrollTo(0, 0); });
  $app.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => api('approveTx', +b.dataset.ok).then(() => toast('אושר')));
  $app.querySelectorAll('[data-no]').forEach(b => b.onclick = () => confirm('לדחות את הבקשה?') && api('rejectTx', +b.dataset.no));
}

function txLine(t, canCancel) {
  const pending = t.status === 'ממתין';
  const isMaaserOnly = t.type === 'מעשר (היסטורי)';
  const sign = t.bal > 0 ? '+' : t.bal < 0 ? '−' : '';
  const cls = pending ? 'pend' : t.bal > 0 ? 'plus' : t.bal < 0 ? 'minus' : '';
  const label = t.reason || t.type;
  return `<div class="tx">
    <div>${esc(label)}${t.type === 'מעשר' || isMaaserOnly ? '<span class="tag">מעשר</span>' : ''}${pending ? '<span class="tag pend">ממתין לאישור</span>' : ''}
      <div class="muted">${heDate(t.date)}${t.reason && !['הוצאה', 'מעשר'].includes(t.type) ? ' · ' + esc(t.type) : ''}</div></div>
    <div class="row" style="flex:0 0 auto;align-items:center">
      <span class="amt ${cls}">${sign}${money(t.amount)}</span>
      ${canCancel && t.type !== 'יתרת פתיחה' ? `<button class="small ghost" data-edit="${t.id}" title="עריכה">✎</button>` : ''}
      ${canCancel ? `<button class="small ghost" data-cancel="${t.id}" title="ביטול">✕</button>` : ''}
    </div></div>`;
}

function goalBlock(g, available, weekly, canEdit) {
  const pct = Math.max(0, Math.min(100, Math.round(available / g.amount * 100)));
  const left = Math.max(0, g.amount - available);
  const weeks = weekly > 0 ? Math.ceil(left / (weekly * 0.9)) : null;
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center"><b style="flex:1">${esc(g.title)}</b>
      ${canEdit ? `<button class="small light" style="flex:0 0 auto" data-gdone="${g.id}">${pct >= 100 ? 'השגתי!' : 'סגירה'}</button>` : ''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted">${money(Math.min(available, g.amount))} מתוך ${money(g.amount)} (${pct}%)
      ${left > 0 && weeks ? ` · עוד כ-${weeks} שבועות בדמי כיס` : ''}${g.due ? ` · יעד: ${heDate(g.due)}` : ''}</div></div>`;
}

function renderKid(k, asParent) {
  $app.innerHTML = `
    <header><h1>${asParent ? '' : 'שלום '}${esc(k.name)}</h1>
      <button class="ghost" id="out">${asParent ? 'חזרה' : 'יציאה'}</button></header>
    <div class="card center">
      <div class="muted">הכסף שלי</div>
      <div class="big">${money(k.available)}</div>
      ${k.pending ? `<div class="pend">+ ${money(k.pending)} ממתין לאישור הורה</div>` : ''}
      <div class="row" style="margin-top:12px">
        <div class="stat"><span class="muted">שמור למעשר</span><b>${money(Math.max(k.maaser, 0))}</b></div>
        <div class="stat"><span class="muted">דמי כיס בשבוע</span><b>${money(k.weekly)}</b></div>
      </div>
    </div>
    <div class="actions">
      <button data-a="הוצאה">הוצאתי</button>
      <button data-a="מעשר">נתתי מעשר</button>
      <button data-a="הכנסה">קיבלתי כסף</button>
    </div>
    ${asParent ? `<div class="row" style="margin-top:8px"><button class="light" data-a="דמי כיס">דמי כיס ידני</button><button class="light" id="settings">הגדרות ${esc(k.name)}</button></div>` : ''}

    <h2>יעדי חיסכון</h2>
    ${k.goals.map(g => goalBlock(g, k.available, k.weekly, true)).join('') || '<div class="muted">אין עדיין יעדים</div>'}
    <button class="light" id="goal" style="width:100%;margin-top:6px">+ יעד חדש</button>

    ${k.bank && (k.bank.text || k.bank.amount) ? `
      <h2>כסף בבנק</h2>
      <div class="card">${esc(k.bank.text)}${k.bank.amount !== '' && k.bank.amount != null ? `<div><b>${money(k.bank.amount)}</b></div>` : ''}
        <div class="muted">עודכן: ${heDate(k.bank.updated) || 'לא ידוע'}</div></div>` : ''}

    <h2>היסטוריה</h2>
    <div class="card">${k.history.map(t => txLine(t, asParent)).join('') || '<div class="muted">אין תנועות</div>'}</div>`;

  document.getElementById('out').onclick = asParent ? () => { view.kid = null; render(); } : doLogout;
  $app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => txForm(k.name, b.dataset.a, asParent));
  document.getElementById('goal').onclick = () => goalForm(k.name);
  const settings = document.getElementById('settings');
  if (settings) settings.onclick = () => kidSettingsForm(k);
  $app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const t = k.history.find(t => t.id === +b.dataset.edit);
    txForm(k.name, t.type === 'מעשר (היסטורי)' ? 'מעשר (היסטורי)' : t.type, true, t);
  });
  $app.querySelectorAll('[data-gdone]').forEach(b => b.onclick = () => {
    const done = confirm('היעד הושג? (אישור = הושג, ביטול = מחיקת היעד)');
    api('closeGoal', +b.dataset.gdone, done ? 'הושג' : 'בוטל');
  });
  $app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () =>
    confirm('לבטל את התנועה? היא תישאר בגיליון מסומנת כ"בוטל"') && api('cancelTx', +b.dataset.cancel).then(() => toast('בוטל')));
}

// ---------- טפסים ----------

function modal(html, onSubmit) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<form class="sheet">${html}
    <div class="row" style="margin-top:18px"><button type="submit">שמירה</button><button type="button" class="light" id="cx">ביטול</button></div></form>`;
  document.body.appendChild(m);
  const f = m.querySelector('form');
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector('#cx').onclick = () => m.remove();
  // סוגרים מיד ושומרים ברקע, כדי שלא יצטרכו לחכות לשרת. שגיאה תוצג בהודעה.
  f.onsubmit = e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    m.remove();
    toast('שומר…');
    Promise.resolve(onSubmit(data)).catch(() => {});
  };
  const first = f.querySelector('input:not([type=hidden])');
  if (first) first.focus();
}

const TITLES = { 'הוצאה': 'הוצאה', 'מעשר': 'נתתי מעשר', 'הכנסה': 'קיבלתי כסף', 'דמי כיס': 'דמי כיס ידני', 'מעשר (היסטורי)': 'מעשר (היסטורי)' };

/** הוספה, או עריכה ע"י הורה כשמועברת תנועה קיימת t */
function txForm(kid, type, asParent, t) {
  const note = type === 'הכנסה' && !asParent ? '<p class="muted">ההכנסה תיכנס ליתרה אחרי אישור הורה.</p>' : '';
  const typeSelect = t ? `<label>סוג</label><select name="type">${Object.keys(TITLES).map(x =>
    `<option value="${esc(x)}" ${x === type ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : '';
  modal(`<h2 style="margin-top:0">${t ? 'עריכה' : TITLES[type]}${asParent ? ' – ' + esc(kid) : ''}</h2>${note}${typeSelect}
    <label>סכום (₪)</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${t ? t.amount : ''}">
    <label>${type === 'מעשר' ? 'למי / למה' : 'סיבה'}</label><input name="reason" maxlength="200" placeholder="${type === 'הוצאה' ? 'למשל: ממתקים' : ''}" value="${t ? esc(t.reason) : ''}">
    <label>תאריך (אפשר לבחור תאריך קודם)</label><input name="date" type="date" value="${t ? t.date : today()}" max="${today()}" required>`,
    d => t
      ? api('updateTx', t.id, { type: d.type, amount: d.amount, reason: d.reason, date: d.date }).then(() => toast('עודכן'))
      : api('addTx', { kid, type, amount: d.amount, reason: d.reason, date: d.date }).then(() => toast('נשמר')));
}

function kidSettingsForm(k) {
  modal(`<h2 style="margin-top:0">הגדרות – ${esc(k.name)}</h2>
    <div class="row">
      <div><label>דמי כיס עד גיל 13</label><input name="under13" type="number" step="0.01" min="0" value="${k.under13}" required></div>
      <div><label>מגיל 13</label><input name="from13" type="number" step="0.01" min="0" value="${k.from13}" required></div>
    </div>
    <label>כסף בבנק – תיאור (רק לתזכורת)</label><textarea name="text" rows="2">${esc(k.bank.text)}</textarea>
    <label>כסף בבנק – סכום אחרון ידוע (₪)</label><input name="amount" type="number" step="0.01" value="${k.bank.amount ?? ''}">
    <label>קוד חדש ל${esc(k.name)} (להשאיר ריק כדי לא לשנות)</label><input name="pin" inputmode="numeric" pattern="\\d{4,8}">`,
    async d => {
      if (+d.under13 !== k.under13 || +d.from13 !== k.from13) await api('setAllowance', k.name, d.under13, d.from13);
      if (d.text !== (k.bank.text || '') || String(d.amount) !== String(k.bank.amount ?? '')) await api('setBank', k.name, d.text, d.amount);
      if (d.pin) await api('setPin', k.name, d.pin);
      toast('נשמר');
    });
}

function goalForm(kid) {
  modal(`<h2 style="margin-top:0">יעד חיסכון חדש</h2>
    <label>מה רוצים לקנות?</label><input name="title" maxlength="80" required>
    <label>כמה זה עולה (₪)</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="1" required>
    <label>עד מתי (לא חובה)</label><input name="due" type="date" min="${today()}">`,
    d => api('addGoal', { kid, title: d.title, amount: d.amount, due: d.due }));
}

function pinsForm() {
  const names = [PARENT, ...state.kids.map(k => k.name)];
  modal(`<h2 style="margin-top:0">קביעת קוד</h2>
    <label>למי</label><select name="who">${names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <label>קוד חדש (4–8 ספרות)</label><input name="pin" inputmode="numeric" pattern="\\d{4,8}" required>`,
    d => api('setPin', d.who, d.pin).then(() => toast('הקוד נשמר')));
}

start().catch(e => { $app.innerHTML = `<div class="loading">שגיאה: ${esc(e.message || e)}</div>`; });
</script>
</body>
</html>
